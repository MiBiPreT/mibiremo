site_name: mibiremo
site_description: MiBiPreT Remediation Module, a Python package for designing and testing bioremediation installations
site_author: Matteo Masi, Jaro Camphuijsen, Robin Richardson
site_url: https://MiBiPreT.github.io/mibiremo
repo_name: MiBiPreT/mibiremo
repo_url: https://github.com/MiBiPreT/mibiremo
edit_uri: "edit/main/docs/"
copyright: Copyright &copy; 2026, MIBIREM Project

nav:
  - Home: index.md
  - Introduction: introduction.md
  - Field model: field_model.md
  - Column model: column_model.md
  - Development: development.md
  - Examples: examples.md
  - Tutorial Notebooks:
    - Titration: notebooks/ex1-titration.ipynb
    - BTEX dissolution: notebooks/ex2-BTEX_dissolution.ipynb
    - BTEX dissolution and transport coupling: notebooks/ex3-BTEX_dissolution_transport_coupling.ipynb
    - Tracer test of a field model: notebooks/ex4-field_tracer_test.ipynb
    - Tracer test with three well layouts: notebooks/ex5-field_tracer_sweep.ipynb
    - Tracer test in a layered aquifer: notebooks/ex6-field_tracer_layered.ipynb
    - Validation against mibitrans: notebooks/ex7-validation-vs-mibitrans.ipynb
    - Laboratory column test: notebooks/ex8-column_test.ipynb
    - Column validation against mibitrans: notebooks/ex9-column_validation-vs-mibitrans.ipynb

  - API Reference: reference.md

theme:
  name: "material"
  favicon: assets/icon.png
  logo: assets/logo.png
  language: en
  # https://squidfunk.github.io/mkdocs-material/setup/changing-the-colors/#primary-color
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - content.code.annotate
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - content.tabs.link
    # - header.autohide
    # - navigation.expand
    # - navigation.instant
    # - navigation.tabs.sticky


plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_submodules: true
            show_source: true
            show_docstring_description: true
            docstring_style: google
            docstring_section_style: table
            docstring_options:
              returns_multiple_items: false
            filters:
              - "!^RM_"
  - mkdocs-jupyter:
      execute: false
      ignore: ["*.md"]  # Markdown pages are not notebooks; parsing them with pandoc warns about "::: mibiremo"
      include_source: true
      custom_mathjax_url: "https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/latest.js?config=TeX-AMS_CHTML-full,Safe"

# Styled blocks: https://squidfunk.github.io/mkdocs-material/reference/admonitions/#supported-types
markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - smarty
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - assets/custom.css

extra_javascript:
  - assets/fontawesome.min.js
  - assets/solid.min.js
  - assets/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MiBiPreT/mibiremo
  version:
    provider: mike
    default: latest
    alias: true
